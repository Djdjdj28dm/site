<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Melek Umut 💜</title>

<style>

body {
    margin:0;
    min-height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;

    background:linear-gradient(
        135deg,
        #fffaff,
        #f3e8ff,
        #e9d5ff,
        #fce7f3
    );

    background-size:400% 400%;
    animation:bg 10s infinite alternate;
}


@keyframes bg {
    0% {
        background-position:left;
    }

    100% {
        background-position:right;
    }
}


.container {
    text-align:center;
    color:#7b2cbf;
    z-index:5;
}


.heart {
    width:380px;
    max-width:85vw;
    animation:kalp 1.5s infinite;

    filter:
    drop-shadow(0 0 15px white)
    drop-shadow(0 0 35px white);
}


@keyframes kalp {
    50% {
        transform:scale(1.07);
    }
}


svg {
    width:100%;
}


.name {
    fill:#8e44ad;
    font-size:32px;
    font-weight:bold;
}


.small {
    fill:#a855f7;
    font-size:18px;
}


h1 {
    font-size:42px;
    color:#7b2cbf;
    text-shadow:0 0 10px white;
}


p {
    font-size:21px;
    line-height:1.6;
    color:#5b21b6;

    background:rgba(255,255,255,0.55);

    padding:20px;
    border-radius:25px;

    box-shadow:0 0 20px rgba(255,255,255,.8);
}


.site {
    margin-top:15px;
    font-size:16px;
    color:#9333ea;
}



.fly {
    position:absolute;
    bottom:-50px;
    font-size:30px;
    animation:uc 8s linear infinite;
}


@keyframes uc {

    0% {
        transform:translateY(0) rotate(0);
        opacity:0;
    }


    20% {
        opacity:1;
    }


    100% {
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }

}


.f1 {left:10%; animation-delay:0s;}
.f2 {left:25%; animation-delay:2s;}
.f3 {left:45%; animation-delay:4s;}
.f4 {left:65%; animation-delay:1s;}
.f5 {left:85%; animation-delay:3s;}


.star {
    position:absolute;
    color:white;
    font-size:25px;
    animation:parla 1.5s infinite alternate;
}


@keyframes parla {

    from {
        opacity:.3;
    }

    to {
        opacity:1;
    }

}


.s1 {top:10%;left:15%;}
.s2 {top:20%;right:15%;}
.s3 {bottom:15%;left:10%;}
.s4 {bottom:20%;right:10%;}


</style>
</head>

<body>


<div class="fly f1">💜</div>
<div class="fly f2">🤍</div>
<div class="fly f3">💖</div>
<div class="fly f4">✨</div>
<div class="fly f5">💜</div>


<div class="star s1">✦</div>
<div class="star s2">✧</div>
<div class="star s3">✦</div>
<div class="star s4">✧</div>



<div class="container">


<div class="heart">

<svg viewBox="0 0 500 450">


<path

d="
M250 420
C220 390 50 280 50 150
C50 60 160 30 250 125
C340 30 450 60 450 150
C450 280 280 390 250 420Z"

fill="white"

/>



<text
x="250"
y="220"
text-anchor="middle"
class="name">

Melek Umut

</text>



<text
x="250"
y="260"
text-anchor="middle"
class="small">

✨ iyi ki varsın ✨

</text>


</svg>

</div>




<h1>
İYİ Kİ VARSIN 💜
</h1>




<p>

Hayatına bazen biri girer<br>

ve bütün hayatını güzelleştirir. ✨

<br><br>

<b>
Sen onlardan birisin. 💜
</b>

<br><br>

Eşek pişman... 🥲<br>

Özür diler... 🤍

<br><br>

İyi ki varsın, iyi ki benim arkadaşımsın. 🌸


</p>



<div class="site">

✨ Site değişebilir, ara sıra bak 💜 ✨

</div>


</div>


</body>
</html>
