<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Melek Umut 💜</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px 15px 170px;

    display: flex;
    justify-content: flex-start;
    align-items: center;
    flex-direction: column;

    font-family: Arial, sans-serif;
    color: #7b2cbf;

    background: linear-gradient(
        135deg,
        #fffdf7,
        #eaf7ff,
        #f5efff,
        #fff0f5
    );

    overflow-x: hidden;
}

.site {
    width: 100%;
    max-width: 600px;
    text-align: center;
}

/* KALP */

.heart-box {
    width: 380px;
    max-width: 85vw;
    margin: 10px auto 25px;
    animation: kalp 1.5s infinite;
}

.heart-box svg {
    width: 100%;
    height: auto;
}

@keyframes kalp {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.04);
    }
}

/* YAZILAR */

h1 {
    font-size: 32px;
    margin: 10px 0 20px;
}

p {
    font-size: 19px;
    line-height: 1.7;
    margin: 8px 0;
}

.footer {
    margin-top: 35px;
    font-size: 14px;
    opacity: 0.75;
}

/* UÇAN KALPLER */

.float {
    position: fixed;
    pointer-events: none;
    font-size: 18px;
    opacity: 0.5;
    animation: floatUp 6s linear forwards;
}

@keyframes floatUp {
    from {
        transform: translateY(20px);
        opacity: 0;
    }

    20% {
        opacity: 0.5;
    }

    to {
        transform: translateY(-100vh);
        opacity: 0;
    }
}

/* MESAJ ALANI */

.message-area {
    width: 100%;
    max-width: 500px;
    margin-top: 80px;
    text-align: center;
}

.message-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 10px;
}

.message-info {
    font-size: 14px;
    margin-bottom: 15px;
    opacity: 0.8;
}

.message-box {
    width: 100%;
    min-height: 120px;
    padding: 15px;

    border: 2px solid #d8b4fe;
    border-radius: 15px;

    background: rgba(255,255,255,0.8);

    color: #5b21b6;
    font-size: 16px;

    resize: vertical;
    outline: none;
}

.message-box:focus {
    border-color: #a855f7;
}

.message-button {
    margin-top: 12px;
    padding: 14px 25px;

    border: none;
    border-radius: 14px;

    background: #a855f7;
    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    transition: transform 0.15s;
}

.message-button:active {
    transform: scale(0.97);
}

/* ACİL DURUM */

.emergency-area {
    margin-top: 160px;
    text-align: center;
}

.emergency-button {
    width: 260px;
    height: 85px;

    border: 3px solid #b00000;
    border-radius: 18px;

    background: #e60000;
    color: white;

    font-size: 21px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 15px rgba(180, 0, 0, 0.25);

    transition:
        transform 0.15s,
        box-shadow 0.15s;
}

.emergency-button:active {
    transform: scale(0.94);
}

#count {
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
}

/* NORMAL ACİL ÇERÇEVE */

.emergency-border {
    position: fixed;
    inset: 4px;

    border: 7px solid rgba(255, 0, 0, 0.75);
    border-radius: 12px;

    pointer-events: none;
    z-index: 9999;

    animation: borderFlash 0.8s ease-out forwards;
}

@keyframes borderFlash {

    0% {
        opacity: 1;
    }

    40% {
        opacity: 0.55;
    }

    100% {
        opacity: 0;
    }
}

/* NORMAL KIRMIZI IŞIK */

.emergency-light {
    position: fixed;

    width: 110px;
    height: 110px;

    border-radius: 50%;

    background: rgba(255, 0, 0, 0.22);

    box-shadow:
        0 0 45px rgba(255, 0, 0, 0.55);

    pointer-events: none;
    z-index: 9998;

    animation: lightFlash 0.7s ease-out forwards;
}

@keyframes lightFlash {

    0% {
        opacity: 1;
        transform: scale(0.65);
    }

    100% {
        opacity: 0;
        transform: scale(1.4);
    }
}

/* 7. BASIŞ PATLAMASI */

.seventh-blast {
    position: fixed;
    inset: 0;

    background: rgba(255, 0, 0, 0.08);

    pointer-events: none;
    z-index: 9990;

    animation: seventhBlast 0.8s ease-out forwards;
}

@keyframes seventhBlast {

    0% {
        opacity: 0;
        transform: scale(0.7);
    }

    25% {
        opacity: 1;
        transform: scale(1.02);
    }

    100% {
        opacity: 0;
        transform: scale(1.15);
    }
}

/* 7. BASIŞTA EKRAN TİTREŞİMİ */

body.seventh-shake {
    animation: screenShake 0.45s ease-in-out;
}

@keyframes screenShake {

    0% {
        transform: translate(0, 0);
    }

    20% {
        transform: translate(-6px, 4px);
    }

    40% {
        transform: translate(6px, -4px);
    }

    60% {
        transform: translate(-5px, -3px);
    }

    80% {
        transform: translate(5px, 3px);
    }

    100% {
        transform: translate(0, 0);
    }
}

/* KONFETİ */

.confetti {
    position: fixed;

    width: 10px;
    height: 16px;

    pointer-events: none;

    z-index: 10000;

    animation:
        confettiFall 1.8s ease-out forwards;
}

@keyframes confettiFall {

    0% {
        transform:
            translate(0, 0)
            rotate(0deg);

        opacity: 1;
    }

    100% {
        transform:
            translate(var(--x), var(--y))
            rotate(var(--r));

        opacity: 0;
    }
}

/* TELEFON */

@media (max-width: 600px) {

    body {
        padding-bottom: 150px;
    }

    .heart-box {
        margin-top: 5px;
    }

    h1 {
        font-size: 27px;
    }

    p {
        font-size: 17px;
    }

    .message-area {
        margin-top: 60px;
    }

    .emergency-area {
        margin-top: 160px;
    }

    .emergency-button {
        width: 240px;
        height: 78px;
        font-size: 19px;
    }
}

</style>
</head>

<body>

<div class="site">

    <div class="heart-box">

        <svg viewBox="0 0 500 450">

            <path
                d="M250 420
                C230 390 40 280 40 145
                C40 60 140 20 205 80
                L250 125
                L295 80
                C360 20 460 60 460 145
                C460 280 270 390 250 420Z"
                fill="white"
                stroke="#e8c8ff"
                stroke-width="5"
            />

            <text
                x="250"
                y="190"
                text-anchor="middle"
                font-size="34"
                fill="#7b2cbf"
                font-weight="bold"
            >
                Melek Umut
            </text>

            <text
                x="250"
                y="235"
                text-anchor="middle"
                font-size="22"
                fill="#a855f7"
            >
                ✨ iyi ki varsın ✨
            </text>

        </svg>

    </div>

    <h1>İYİ Kİ VARSIN 💖</h1>

    <p>Hayatına bazen biri girer</p>
    <p>ve bütün hayatını güzelleştirir. ✨</p>
    <p>Sen onlardan birisin.</p>

    <p>daha yeni basladıkkk... 💗</p>

    <p>
        İyi ki varsın, iyi ki benim melegimsin. 🌸
    </p>

    <div class="footer">
        ✨ Site değişebilir, ara sıra bak 💜 ✨
    </div>

</div>


<!-- MESAJ -->

<div class="message-area">

    <div class="message-title">
        💌 Umut'a bir not bırak
    </div>

    <div class="message-info">
        Yazdıkların otomatik olarak Umut'a iletilir.
    </div>

    <textarea
        id="messageBox"
        class="message-box"
        placeholder="Buraya bir şeyler yazabilirsin..."
    ></textarea>

    <button
        class="message-button"
        onclick="finishMessage()"
    >
        📨 Mesajı Gönder
    </button>

</div>


<!-- ACİL DURUM -->

<div class="emergency-area">

    <button
        class="emergency-button"
        onclick="emergency()"
    >
        🚨 ACİL DURUM 🚨
    </button>

    <div id="count"></div>

</div>


<script>

const WORKER_URL =
    "https://melos-telegram.ut380806.workers.dev";


/* SİTEYE GİRİŞ */

fetch(WORKER_URL)
    .catch(() => {});


/* UÇAN KALPLER */

setInterval(() => {

    const heart =
        document.createElement("div");

    heart.className = "float";

    heart.innerText =
        Math.random() > 0.5 ? "💜" : "✨";

    heart.style.left =
        Math.random() * 100 + "%";

    heart.style.bottom = "-20px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);

}, 1800);


/* OTOMATİK MESAJ */

let lastSentMessage = "";
let sendingMessage = false;
let hadText = false;

setInterval(async () => {

    const box =
        document.getElementById("messageBox");

    if (!box || sendingMessage) {
        return;
    }

    const currentMessage =
        box.value;

    if (currentMessage === lastSentMessage) {
        return;
    }

    if (!currentMessage.trim() && !hadText) {
        return;
    }

    sendingMessage = true;

    let messageToSend;

    if (!currentMessage.trim()) {

        messageToSend =
            "🗑️ Mesaj alanı tamamen silindi.";

    } else {

        messageToSend =
            currentMessage;

    }

    try {

        const response =
            await fetch(
                WORKER_URL + "?action=message",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: messageToSend
                    })
                }
            );

        if (response.ok) {

            lastSentMessage =
                currentMessage;

            hadText =
                !!currentMessage.trim();
        }

    } catch {
        /* Sessizce devam eder */
    }

    sendingMessage = false;

}, 1000);


/* MESAJI BİTİR */

async function finishMessage() {

    const box =
        document.getElementById("messageBox");

    const message =
        box.value.trim();

    if (!message) {
        return;
    }

    try {

        await fetch(
            WORKER_URL + "?action=message",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message:
                        "✅ MESAJ TAMAMLANDI\n\n" +
                        message
                })
            }
        );

    } catch {
        /* Sessizce devam eder */
    }

}


/* KONFETİ PATLAMASI */

function createConfetti() {

    const pieces = 80;

    for (let i = 0; i < pieces; i++) {

        const confetti =
            document.createElement("div");

        confetti.className = "confetti";

        confetti.style.left = "50%";
        confetti.style.top = "50%";

        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            180 + Math.random() * 300;

        const x =
            Math.cos(angle) * distance;

        const y =
            Math.sin(angle) * distance;

        const rotation =
            Math.random() * 720 - 360;

        confetti.style.setProperty(
            "--x",
            x + "px"
        );

        confetti.style.setProperty(
            "--y",
            y + "px"
        );

        confetti.style.setProperty(
            "--r",
            rotation + "deg"
        );

        /* Konfeti renkleri */

        const colors = [
            "#ff4d6d",
            "#ffd166",
            "#06d6a0",
            "#4dabf7",
            "#a855f7",
            "#ff8fab"
        ];

        confetti.style.background =
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ];

        confetti.style.transform =
            "rotate(" +
            Math.random() * 360 +
            "deg)";

        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 1900);
    }
}


/* 7. BASIŞ ÖZEL EFEKT */

function seventhBlast() {

    const blast =
        document.createElement("div");

    blast.className =
        "seventh-blast";

    document.body.appendChild(blast);

    document.body.classList.add(
        "seventh-shake"
    );

    createConfetti();

    setTimeout(() => {

        blast.remove();

        document.body.classList.remove(
            "seventh-shake"
        );

    }, 850);

}


/* ACİL DURUM */

let emergencyCount = 0;

function emergency() {

    emergencyCount++;

    document.getElementById("count").innerText =
        "🚨 Acil durum butonuna " +
        emergencyCount +
        " kez basıldı!";


    /* Normal kırmızı çerçeve */

    const border =
        document.createElement("div");

    border.className =
        "emergency-border";

    document.body.appendChild(border);


    /* Normal kırmızı ışık */

    const light =
        document.createElement("div");

    light.className =
        "emergency-light";

    light.style.left =
        Math.random() * 80 + 10 + "%";

    light.style.top =
        Math.random() * 70 + 10 + "%";

    document.body.appendChild(light);


    setTimeout(() => {

        border.remove();
        light.remove();

    }, 800);


    /* 7. BASIŞ */

    if (emergencyCount === 7) {
        seventhBlast();
    }


    /* TELEGRAM */

    fetch(
        WORKER_URL +
        "?action=emergency&count=" +
        emergencyCount
    ).catch(() => {});

}

</script>

</body>
</html>
