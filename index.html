<style>

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #fffdf7,
        #eaf7ff,
        #f5efff,
        #fff0f5
    );

    background-size: 400% 400%;
    animation: bg 10s infinite alternate;

    padding: 40px 15px;
    box-sizing: border-box;
}

@keyframes bg {
    0% { background-position: left; }
    100% { background-position: right; }
}

.container {
    text-align: center;
    color: #7b2cbf;
    z-index: 5;
    width: 100%;
    max-width: 700px;
}

.heart {
    width: 380px;
    max-width: 85vw;
    margin: 0 auto;

    animation: kalp 1.5s infinite;

    filter:
    drop-shadow(0 0 15px white)
    drop-shadow(0 0 35px white);
}

@keyframes kalp {
    50% {
        transform: scale(1.07);
    }
}

svg {
    width: 100%;
}

.name {
    fill: #8e44ad;
    font-size: 32px;
    font-weight: bold;
}

.small {
    fill: #a855f7;
    font-size: 18px;
}

h1 {
    font-size: 42px;

    text-shadow: 0 0 10px white;
}

p {
    font-size: 21px;
    line-height: 1.6;

    background: rgba(255,255,255,0.65);

    padding: 20px;
    border-radius: 25px;

    box-shadow: 0 0 20px rgba(255,255,255,.8);
}

.site {
    margin-top: 15px;
    font-size: 16px;
    color: #9333ea;
}

.fly {
    position: fixed;
    bottom: -50px;
    font-size: 30px;
    animation: uc 8s linear infinite;
    pointer-events: none;
}

@keyframes uc {
    0% {
        transform: translateY(0) rotate(0);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

.f1 {left: 10%; animation-delay: 0s;}
.f2 {left: 25%; animation-delay: 2s;}
.f3 {left: 45%; animation-delay: 4s;}
.f4 {left: 65%; animation-delay: 1s;}
.f5 {left: 85%; animation-delay: 3s;}

.star {
    position: fixed;
    color: white;
    font-size: 25px;
    animation: parla 1.5s infinite alternate;
    pointer-events: none;
}

@keyframes parla {
    from { opacity: .3; }
    to { opacity: 1; }
}

.s1 {top: 10%; left: 15%;}
.s2 {top: 20%; right: 15%;}
.s3 {bottom: 15%; left: 10%;}
.s4 {bottom: 20%; right: 10%;}


/* 🚨 ACİL DURUM BUTONU */

.emergency-area {
    margin-top: 30px;
}

.emergency-button {
    width: 270px;
    height: 90px;

    border: none;
    border-radius: 22px;

    background: #d90429;
    color: white;

    font-size: 25px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(217,4,41,.7),
        0 0 35px rgba(217,4,41,.5);

    transition: transform .15s;
}

.emergency-button:active {
    transform: scale(.93);
}

.emergency-count {
    margin-top: 12px;
    color: #b00020;
    font-weight: bold;
    font-size: 17px;
}


/* Kırmızı acil durum ışıkları */

.emergency-light {
    position: fixed;
    width: 90px;
    height: 90px;

    border-radius: 50%;

    background: #ff0033;

    box-shadow:
        0 0 20px #ff0033,
        0 0 50px #ff0033,
        0 0 90px #ff0033;

    pointer-events: none;

    animation: emergencyFlash .45s infinite alternate;
    z-index: 20;
}

@keyframes emergencyFlash {
    from {
        opacity: .15;
        transform: scale(.7);
    }

    to {
        opacity: 1;
        transform: scale(1.3);
    }
}


/* Ekran kenarındaki kırmızı uyarı */

.emergency-border {
    position: fixed;
    inset: 0;

    pointer-events: none;

    border: 12px solid rgba(255,0,40,.8);

    box-sizing: border-box;

    animation: borderFlash .5s infinite alternate;

    z-index: 19;
}

@keyframes borderFlash {
    from {
        opacity: .2;
        box-shadow: inset 0 0 30px rgba(255,0,40,.4);
    }

    to {
        opacity: 1;
        box-shadow:
            inset 0 0 80px rgba(255,0,40,.9),
            0 0 50px rgba(255,0,40,.8);
    }
}


/* Telefon için */

@media (max-width: 600px) {

    h1 {
        font-size: 32px;
    }

        padding: 18px;
    }

    .heart {
        width: 320px;
    }

    .emergency-button {
        width: 240px;
        height: 82px;
        font-size: 22px;
    }

}

</style>
