<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Melek Umut 💜</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px 15px 170px;

    display: flex;
    justify-content: flex-start;
    align-items: center;
    flex-direction: column;

    font-family: Arial, sans-serif;
    color: #7b2cbf;

    background: linear-gradient(
        135deg,
        #fffdf7,
        #eaf7ff,
        #f5efff,
        #fff0f5
    );

    overflow-x: hidden;
}

/* ANA ALAN */

.site {
    width: 100%;
    max-width: 600px;
    text-align: center;
}

/* KALP */

.heart-box {
    width: 380px;
    max-width: 85vw;
    margin: 10px auto 25px;

    animation: kalp 1.5s infinite;
}

.heart-box svg {
    width: 100%;
    height: auto;
}

@keyframes kalp {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.04);
    }

}

/* YAZILAR */

h1 {
    font-size: 32px;
    margin: 10px 0 20px;
}

p {
    font-size: 19px;
    line-height: 1.7;
    margin: 8px 0;
}

/* ALT YAZI */

.footer {
    margin-top: 35px;
    font-size: 14px;
    opacity: 0.75;
}

/* HAFİF UÇAN KALPLER */

.float {
    position: fixed;
    pointer-events: none;
    font-size: 18px;
    opacity: 0.5;

    animation: floatUp 6s linear forwards;
}

@keyframes floatUp {

    from {
        transform: translateY(20px);
        opacity: 0;
    }

    20% {
        opacity: 0.5;
    }

    to {
        transform: translateY(-100vh);
        opacity: 0;
    }

}

/* ACİL DURUM ALANI */

.emergency-area {
    margin-top: 160px;
    text-align: center;
}

.emergency-button {
    width: 260px;
    height: 85px;

    border: 3px solid #b00000;
    border-radius: 18px;

    background: #e60000;
    color: white;

    font-size: 21px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 5px 15px rgba(180, 0, 0, 0.25);

    transition: transform 0.15s;
}

.emergency-button:active {
    transform: scale(0.96);
}

#count {
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
}

/* HAFİF ACİL EFEKTİ */

.emergency-border {
    position: fixed;
    inset: 5px;

    border: 5px solid rgba(255, 0, 0, 0.65);
    border-radius: 12px;

    pointer-events: none;
    z-index: 9999;

    animation: borderFlash 0.7s ease-out forwards;
}

@keyframes borderFlash {

    0% {
        opacity: 0.9;
    }

    50% {
        opacity: 0.35;
    }

    100% {
        opacity: 0;
    }

}

/* TEK BİR HAFİF IŞIK */

.emergency-light {
    position: fixed;

    width: 90px;
    height: 90px;

    border-radius: 50%;

    background: rgba(255, 0, 0, 0.18);

    box-shadow: 0 0 35px rgba(255, 0, 0, 0.45);

    pointer-events: none;
    z-index: 9998;

    animation: lightFlash 0.65s ease-out forwards;
}

@keyframes lightFlash {

    0% {
        opacity: 0.9;
        transform: scale(0.7);
    }

    100% {
        opacity: 0;
        transform: scale(1.25);
    }

}

/* TELEFON */

@media (max-width: 600px) {

    body {
        padding-bottom: 150px;
    }

    .heart-box {
        margin-top: 5px;
    }

    h1 {
        font-size: 27px;
    }

    p {
        font-size: 17px;
    }

    .emergency-area {
        margin-top: 160px;
    }

    .emergency-button {
        width: 240px;
        height: 78px;
        font-size: 19px;
    }

}

</style>
</head>

<body>

<div class="site">

    <div class="heart-box">

        <svg viewBox="0 0 500 450">

            <path
                d="M250 420
                C230 390 40 280 40 145
                C40 60 140 20 205 80
                L250 125
                L295 80
                C360 20 460 60 460 145
                C460 280 270 390 250 420Z"
                fill="white"
                stroke="#e8c8ff"
                stroke-width="5"
            />

            <text
                x="250"
                y="190"
                text-anchor="middle"
                font-size="34"
                fill="#7b2cbf"
                font-weight="bold"
            >
                Melek Umut
            </text>

            <text
                x="250"
                y="235"
                text-anchor="middle"
                font-size="22"
                fill="#a855f7"
            >
                ✨ iyi ki varsın ✨
            </text>

        </svg>

    </div>


    <h1>İYİ Kİ VARSIN 💖</h1>


    <p>Hayatına bazen biri girer</p>
    <p>ve bütün hayatını güzelleştirir. ✨</p>
    <p>Sen onlardan birisin.</p>

    <p>daha yeni basladıkkk... 💗</p>

    <p>
        İyi ki varsın, iyi ki benim melegimsin. 🌸
    </p>


    <div class="footer">
        ✨ Site değişebilir, ara sıra bak 💜 ✨
    </div>

</div>


<!-- ACİL DURUM BUTONU -->

<div class="emergency-area">

    <button
        class="emergency-button"
        onclick="emergency()"
    >
        🚨 ACİL DURUM 🚨
    </button>

    <div id="count"></div>

</div>


<script>

/* ZİYARET BİLDİRİMİ */

fetch(
    "https://melos-telegram.ut380806.workers.dev/"
).catch(() => {});


/* HAFİF UÇAN KALPLER */

setInterval(() => {

    const heart = document.createElement("div");

    heart.className = "float";

    heart.innerText =
        Math.random() > 0.5 ? "💜" : "✨";

    heart.style.left =
        Math.random() * 100 + "%";

    heart.style.bottom = "-20px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);

}, 1800);


/* ACİL DURUM */

let emergencyCount = 0;

function emergency() {

    emergencyCount++;

    document.getElementById("count").innerText =
        "🚨 Acil durum butonuna " +
        emergencyCount +
        " kez basıldı!";


    /* Hafif kırmızı çerçeve */

    const border =
        document.createElement("div");

    border.className =
        "emergency-border";

    document.body.appendChild(border);


    /* Tek hafif ışık */

    const light =
        document.createElement("div");

    light.className =
        "emergency-light";

    light.style.left =
        Math.random() * 80 + 10 + "%";

    light.style.top =
        Math.random() * 70 + 10 + "%";

    document.body.appendChild(light);


    /* Efektleri kısa sürede temizle */

    setTimeout(() => {
        border.remove();
        light.remove();
    }, 700);


    /* TELEGRAM */

    fetch(
        "https://melos-telegram.ut380806.workers.dev/?action=emergency&count="
        + emergencyCount
    ).catch(() => {});

}

</script>

</body>
</html>
